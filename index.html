/* ===== FeeFlow fintech layer: layout, shapes and depth only; palette and Manrope untouched ===== */
body::before{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--a) 15%,var(--bg)) 100%)}

const SB={
cfg:window.FF_CFG||{},_f:null,ses:null,
get url(){return(this.cfg.url||"").replace(/\/+$/,"")},
ready(){return/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(this.url)&&(this.cfg.key||"").length>40},
init(){try{this.ses=JSON.parse(localStorage.getItem("ff_sb")||"null")}catch(e){this.ses=null}},
keep(s){this.ses=s;try{s?localStorage.setItem("ff_sb",JSON.stringify(s)):localStorage.removeItem("ff_sb")}catch(e){}},
async raw(p,o={}){
const h={apikey:this.cfg.key,"Content-Type":"application/json",Authorization:"Bearer "+((!o.anon&&this.ses)?this.ses.access_token:this.cfg.key),...(o.h||{})};
let r;try{r=await fetch(this.url+p,{method:o.m||"GET",headers:h,body:o.b===undefined?undefined:JSON.stringify(o.b)})}catch(e){throw{offline:true,message:"No internet connection"}}
const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
if(!r.ok)throw{status:r.status,code:j&&(j.error_code||j.code),message:(j&&(j.msg||j.message||j.error_description||j.error))||"Something went wrong"};
return j},
take(j){if(j&&j.access_token)this.keep({access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1e3,user:j.user});return j},
fresh(){const s=this.ses;if(!s)return Promise.resolve(false);if(s.exp-Date.now()>6e4)return Promise.resolve(true);
if(!this._f)this._f=(async()=>{try{this.take(await this.raw("/auth/v1/token?grant_type=refresh_token",{m:"POST",anon:true,b:{refresh_token:s.refresh_token}}));return true}
catch(e){if(e.offline)return true;if(e.status>=400&&e.status<500){this.keep(null);return false}return true}finally{this._f=null}})();
return this._f},
async api(p,o){await this.fresh();return this.raw(p,o)},
get(q){return this.api("/rest/v1/"+q)},
rpc(n,a){return this.api("/rest/v1/rpc/"+n,{m:"POST",b:a||{}})},
signUp(email,password,biz){return this.raw("/auth/v1/signup",{m:"POST",anon:true,b:{email,password,data:{biz}}})},
resend(email){return this.raw("/auth/v1/resend",{m:"POST",anon:true,b:{type:"signup",email}})},
verify(email,token,type){return this.raw("/auth/v1/verify",{m:"POST",anon:true,b:{email,token,type}}).then(j=>this.take(j))},
login(email,password){return this.raw("/auth/v1/token?grant_type=password",{m:"POST",anon:true,b:{email,password}}).then(j=>this.take(j))},
recover(email){return this.raw("/auth/v1/recover",{m:"POST",anon:true,b:{email}})},
setPassword(password){return this.api("/auth/v1/user",{m:"PUT",b:{password}})},
async out(){try{if(this.ses)await this.raw("/auth/v1/logout?scope=local",{m:"POST"})}catch(e){}this.keep(null)}
};
