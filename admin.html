<style>
:root{color-scheme:light;--bg:#f3f5fa;--sf:#fff;--tx:#0e1424;--mu:#647089;--ln:#e1e6f0;--a:#5b4bff;--on:#fff;--bgb:var(--a);--up:#0c9a78;--dn:#e0325a;--wn:#c47a00;--sh:0 1px 2px rgba(14,20,36,.05),0 10px 28px rgba(30,40,90,.07);--f:'Manrope',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a0c16;--sf:#141829;--tx:#eceefa;--mu:#8c93b0;--ln:#242a42;--a:#7466ff;--on:#fff;--hb:#5547f0;--bgb:linear-gradient(135deg,#9488ff,#7466ff 52%,#5b4bff);--up:#34d6a4;--dn:#ff6b8e;--wn:#ffbf5c;--sh:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0c16;--sf:#141829;--tx:#eceefa;--mu:#8c93b0;--ln:#242a42;--a:#7466ff;--on:#fff;--hb:#5547f0;--bgb:linear-gradient(135deg,#9488ff,#7466ff 52%,#5b4bff);--up:#34d6a4;--dn:#ff6b8e;--wn:#ffbf5c;--sh:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 38% at 85% -6%,color-mix(in srgb,var(--a) 20%,transparent),transparent)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.w{max-width:520px;margin:auto;padding:14px 16px 120px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}h2{font-size:22px}h3{font-size:18px;margin-bottom:12px}.sh3{margin:20px 2px 10px;font-size:16px}
small,.mu{color:var(--mu);font-size:13px}.ctr{text-align:center;display:block;margin:12px 0}
label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:2px 2px 6px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--wn)}.row,.m{display:flex;align-items:center;gap:12px}.fx{flex:1;min-width:0}.m b,.fx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row input{margin:0}
.hd,.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
.lg{font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px}.mk{width:28px;height:28px;border-radius:9px;background:var(--a);display:grid;place-items:center}.mk .ic{width:16px;height:16px;stroke:var(--on);stroke-width:2.6}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.ah{font-size:30px;line-height:1.1;margin:26px 0 8px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;margin-bottom:12px}textarea{resize:vertical}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:12px;padding:12px 16px;font:700 14px var(--f);color:var(--on);background:var(--a);cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}.b:active{transform:scale(.96)}

/* ===== FeeFlow fintech layer: layout, shapes and depth only; palette and Manrope untouched ===== */

<script>
/* ---- Supabase client (plain fetch, no libraries) ---- */
const SB={
cfg:window.FF_CFG||{},_f:null,ses:null,
get url(){return(this.cfg.url||"").replace(/\/+$/,"")},
ready(){return/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(this.url)&&(this.cfg.key||"").length>40},
init(){try{this.ses=JSON.parse(localStorage.getItem("ff_sb")||"null")}catch(e){this.ses=null}},
keep(s){this.ses=s;try{s?localStorage.setItem("ff_sb",JSON.stringify(s)):localStorage.removeItem("ff_sb")}catch(e){}},
async raw(p,o={}){
const h={apikey:this.cfg.key,"Content-Type":"application/json",Authorization:"Bearer "+((!o.anon&&this.ses)?this.ses.access_token:this.cfg.key),...(o.h||{})};
let r;try{r=await fetch(this.url+p,{method:o.m||"GET",headers:h,body:o.b===undefined?undefined:JSON.stringify(o.b)})}catch(e){throw{offline:true,message:"No internet connection"}}
const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
if(!r.ok)throw{status:r.status,code:j&&(j.error_code||j.code),message:(j&&(j.msg||j.message||j.error_description||j.error))||"Something went wrong"};
return j},
take(j){if(j&&j.access_token)this.keep({access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1e3,user:j.user});return j},
fresh(){const s=this.ses;if(!s)return Promise.resolve(false);if(s.exp-Date.now()>6e4)return Promise.resolve(true);
if(!this._f)this._f=(async()=>{try{this.take(await this.raw("/auth/v1/token?grant_type=refresh_token",{m:"POST",anon:true,b:{refresh_token:s.refresh_token}}));return true}
catch(e){if(e.offline)return true;if(e.status>=400&&e.status<500){this.keep(null);return false}return true}finally{this._f=null}})();
return this._f},
async api(p,o){await this.fresh();return this.raw(p,o)},
get(q){return this.api("/rest/v1/"+q)},
rpc(n,a){return this.api("/rest/v1/rpc/"+n,{m:"POST",b:a||{}})},
signUp(email,password,biz){return this.raw("/auth/v1/signup",{m:"POST",anon:true,b:{email,password,data:{biz}}})},
resend(email){return this.raw("/auth/v1/resend",{m:"POST",anon:true,b:{type:"signup",email}})},
verify(email,token,type){return this.raw("/auth/v1/verify",{m:"POST",anon:true,b:{email,token,type}}).then(j=>this.take(j))},
login(email,password){return this.raw("/auth/v1/token?grant_type=password",{m:"POST",anon:true,b:{email,password}}).then(j=>this.take(j))},
recover(email){return this.raw("/auth/v1/recover",{m:"POST",anon:true,b:{email}})},
setPassword(password){return this.api("/auth/v1/user",{m:"PUT",b:{password}})},
async out(){try{if(this.ses)await this.raw("/auth/v1/logout?scope=local",{m:"POST"})}catch(e){}this.keep(null)}
};
SB.init();

const A={v:"in",tab:"u",users:[],coupons:[],cfg:{},q:"",f:"all",busy:0,me:null};
const fdt=s=>s?new Date(s).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"Never";
const ago=s=>{if(!s)return"Never";const m=(Date.now()-new Date(s))/6e4;return m<2?"Just now":m<60?Math.floor(m)+" min ago":m<1440?Math.floor(m/60)+" h ago":Math.floor(m/1440)+" d ago"};
const stt=u=>{const e=u.expires_at?new Date(u.expires_at):null;if(u.blocked)return["Blocked","dn","blocked"];if(u.plan==="pro"&&e&&e>new Date())return["Pro · "+Math.ceil((e-new Date())/864e5)+"d","up","pro"];if(u.plan==="pro")return["Expired","wn","expired"];return["Free","","free"]};
function toast(t){const e=document.createElement("div");e.className="ts";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const err=e=>toast(e.offline?"No internet connection":e.message);
const head=(t,s,r)=>`<div class="hero sm"><div class="top"><div class="lg"><i class="mk"><img style="width:100%;height:100%;object-fit:contain" alt="" src="${LOGO}"></i><span>FeeFlow Admin</span></div>${r||""}</div><h1 class="ah">${t}</h1><p class="mu">${s||""}</p></div>`;
function show(){const a=$("app");
if(!SB.ready())return a.innerHTML=`<div class="w">${head("Setup needed","Open config.js, paste your Supabase URL and anon key, then reload.")}</div>`;
if(A.v==="in")return a.innerHTML=`<div class="w" style="max-width:520px">${head("Admin log in","Use the email and password of your admin account.")}<div class="c ain"><label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@email.com"><label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="b w" onclick="login()">Log in</button><small class="ctr">Forgot your password? Use Forgot password in the FeeFlow app, then come back here.</small></div></div>`;
if(A.v==="no")return a.innerHTML=`<div class="w" style="max-width:520px">${head("No access","This account is not an admin.")}<button class="b s w" onclick="logout()">Log out</button></div>`;
const T=[["u","Users"],["c","Coupons"],["s","Settings"]];
a.innerHTML=`<div class="w">${head("Dashboard",esc(A.me.email),`<button class="b s" onclick="logout()">Log out</button>`)}<div class="seg">${T.map(t=>`<button class="${A.tab===t[0]?"on":""}" onclick="A.tab='${t[0]}';show()">${t[1]}</button>`).join("")}</div><div id="vw"></div></div>`;
({u:vUsers,c:vCoupons,s:vSettings})[A.tab]()}
async function login(){const em=$("em").value.trim().toLowerCase(),pw=$("pw").value;if(!em||!pw)return toast("Enter email and password");
try{await SB.login(em,pw);await boot()}catch(e){toast(e.status===400?"Wrong email or password":e.message)}}
async function logout(){await SB.out();A.v="in";show()}
async function boot(){if(!SB.ready())return show();SB.init();if(!SB.ses||!await SB.fresh()){A.v="in";return show()}
try{const p=(await SB.get("profiles?select=id,email,role&id=eq."+SB.ses.user.id))[0];if(!p||p.role!=="admin"){A.v="no";return show()}A.me=p;A.v="app";await load();show()}catch(e){A.v="in";show();err(e)}}
async function load(){const[u,c,g]=await Promise.all([SB.rpc("admin_users"),SB.get("coupons?select=*&order=created_at.desc"),SB.get("app_config?select=key,value")]);A.users=u;A.coupons=c;A.cfg={};g.forEach(x=>A.cfg[x.key]=x.value)}
async function reload(){try{await load();show()}catch(e){err(e)}}
/* users */
function vUsers(){const U=A.users,n7=Date.now()-7*864e5,c={pro:0,expired:0,free:0,blocked:0};U.forEach(u=>c[stt(u)[2]]++);
const L=U.filter(u=>(A.f==="all"||stt(u)[2]===A.f)&&(!A.q||(u.email+" "+(u.biz||"")).toLowerCase().includes(A.q.toLowerCase())));
$("vw").innerHTML=`<div class="g4"><div class="c"><small>Total users</small><b>${U.length}</b></div><div class="c"><small>Pro active</small><b class="up">${c.pro}</b></div><div class="c"><small>Pro expired</small><b class="wn">${c.expired}</b></div><div class="c"><small>New in 7 days</small><b>${U.filter(u=>new Date(u.created_at)>n7).length}</b></div></div>
<div class="bar" style="margin-bottom:12px"><input id="sq" placeholder="Search email or business" value="${esc(A.q)}" oninput="A.q=this.value;list()"><select onchange="A.f=this.value;list()">${[["all","All users"],["pro","Pro active"],["expired","Pro expired"],["free","Free"],["blocked","Blocked"]].map(o=>`<option value="${o[0]}" ${A.f===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div><div id="ul"></div>`;list()}
function list(){const L=A.users.filter(u=>(A.f==="all"||stt(u)[2]===A.f)&&(!A.q||(u.email+" "+(u.biz||"")).toLowerCase().includes(A.q.toLowerCase())));
$("ul").innerHTML=L.length?L.map(u=>{const s=stt(u);return`<div class="c ur row" onclick="user('${u.id}')"><div class="fx"><b>${esc(u.biz||"No business name")}</b><small>${esc(u.email)}${u.role==="admin"?" · admin":""}</small></div><div style="text-align:right"><span class="chip ${s[1]}">${s[0]}</span><small style="display:block">${u.members} members · ${ago(u.last_seen)}</small></div></div>`}).join(""):`<div class="c"><small>No users match.</small></div>`}
function user(id){const u=A.users.find(x=>x.id===id);if(!u)return;const s=stt(u),me=u.id===A.me.id;
$("md").innerHTML=`<div class="mdl" onclick="if(event.target===this)closeM()"><div class="c"><div class="row"><div class="fx"><h3 style="margin:0">${esc(u.biz||"No business name")}</h3><small>${esc(u.email)}</small></div><button class="ib" onclick="closeM()" aria-label="Close">✕</button></div><div style="height:10px"></div>
<div class="kv"><small>Plan</small><b class="${s[1]}">${s[0]}</b></div><div class="kv"><small>Pro ends</small><b>${u.expires_at?fdt(u.expires_at):"—"}</b></div><div class="kv"><small>Members · payments</small><b>${u.members} · ${u.payments}</b></div><div class="kv"><small>Joined</small><b>${fdt(u.created_at)}</b></div><div class="kv"><small>Last seen</small><b>${ago(u.last_seen)}</b></div>
<label style="margin-top:14px">Give Pro for</label><div class="act" style="margin-top:0">${[7,30,90,365].map(d=>`<button class="b s" onclick="grant('${u.id}',${d})">+${d}d</button>`).join("")}</div>
<div class="cpr" style="margin-top:8px"><input id="gd" type="number" min="1" placeholder="Custom days" style="text-transform:none"><button class="b" onclick="grant('${u.id}',+$('gd').value)">Add</button></div>
<div class="act"><button class="b s" onclick="revoke('${u.id}')">Remove Pro</button>${me?"":`<button class="b s dn" onclick="block('${u.id}',${!u.blocked})">${u.blocked?"Unblock":"Block"} user</button>`}</div></div></div>`}
const closeM=()=>$("md").innerHTML="";
async function act(fn,msg,id){try{await fn();await load();toast(msg);show();if(id)user(id)}catch(e){err(e)}}
const grant=(id,d)=>{if(!(d>=1))return toast("Enter the number of days");act(()=>SB.rpc("admin_grant",{p_user:id,p_days:d}),"Added "+d+" days",id)};
const revoke=id=>{if(confirm("Remove Pro from this user?"))act(()=>SB.rpc("admin_revoke",{p_user:id}),"Pro removed",id)};
const block=(id,b)=>{if(confirm((b?"Block":"Unblock")+" this user?"))act(()=>SB.api("/rest/v1/profiles?id=eq."+id,{m:"PATCH",b:{blocked:b},h:{Prefer:"return=minimal"}}),b?"User blocked":"User unblocked",id)};
/* coupons */
function vCoupons(){$("vw").innerHTML=`<div class="c"><h3>New coupon</h3><div class="two"><div><label>Code</label><input id="nc" placeholder="e.g. DIWALI30" style="text-transform:uppercase"></div><div><label>Days of Pro</label><input id="nd" type="number" min="1" value="30"></div><div><label>Max uses (blank = unlimited)</label><input id="nm" type="number" min="1"></div><div><label>Valid until (optional)</label><input id="nv" type="date"></div></div><button class="b w" onclick="addC()">Create coupon</button></div>
${A.coupons.map(c=>`<div class="c row"><div class="fx"><b>${esc(c.code)}</b><small>${c.days} days · used ${c.used_count}${c.max_uses?" of "+c.max_uses:""}${c.valid_until?" · until "+fdt(c.valid_until):""}</small></div><span class="chip ${c.active?"up":"dn"}">${c.active?"Active":"Off"}</span><button class="b s" onclick="togC('${esc(c.code)}',${!c.active})">${c.active?"Disable":"Enable"}</button><button class="b s dn" onclick="delC('${esc(c.code)}')">Delete</button></div>`).join("")||`<div class="c"><small>No coupons yet.</small></div>`}`}
function addC(){const code=$("nc").value.trim().toUpperCase(),days=+$("nd").value,mx=$("nm").value,vu=$("nv").value;if(!/^[A-Z0-9_-]{3,20}$/.test(code))return toast("Code: 3 to 20 letters or numbers");if(!(days>=1))return toast("Enter days");
act(()=>SB.api("/rest/v1/coupons",{m:"POST",b:{code,days,max_uses:mx?+mx:null,valid_until:vu||null},h:{Prefer:"return=minimal"}}),"Coupon "+code+" created")}
const togC=(c,a)=>act(()=>SB.api("/rest/v1/coupons?code=eq."+encodeURIComponent(c),{m:"PATCH",b:{active:a},h:{Prefer:"return=minimal"}}),a?"Coupon enabled":"Coupon disabled");
const delC=c=>{if(confirm("Delete "+c+"? Users who used it keep their Pro."))act(()=>SB.api("/rest/v1/coupons?code=eq."+encodeURIComponent(c),{m:"DELETE",h:{Prefer:"return=minimal"}}),"Coupon deleted")};
/* settings */
function vSettings(){const a=A.cfg.announcement||{on:false,text:""};
$("vw").innerHTML=`<div class="c"><h3>Announcement banner</h3><small>Shown at the bottom of the app. Users can dismiss it.</small><div style="height:10px"></div><label>Message</label><input id="at" value="${esc(a.text)}" placeholder="e.g. New feature: Kannada language"><label class="row" style="margin:0 0 12px"><input id="ao" type="checkbox" style="width:auto;margin:0" ${a.on?"checked":""}> Show banner</label><button class="b w" onclick="saveA()">Save announcement</button></div>
<div class="c"><h3>Force update</h3><small>The app is version 20. If you set this higher than the version inside the app, every user sees “Update ready, tap to refresh”. Set 0 to turn off.</small><div style="height:10px"></div><label>Minimum app version</label><input id="mv" type="number" min="0" value="${+A.cfg.min_app_version||0}"><button class="b w" onclick="saveV()">Save version</button></div>
<div class="c"><h3>Make another admin</h3><small>Ask them to sign up in the app first, then run this in the Supabase SQL Editor:</small><pre style="white-space:pre-wrap;word-break:break-all;font-size:13px">update public.profiles set role = 'admin' where email = 'their@email.com';</pre></div>`}
const cfgSave=(k,v,m)=>act(()=>SB.api("/rest/v1/app_config?on_conflict=key",{m:"POST",b:{key:k,value:v},h:{Prefer:"resolution=merge-duplicates,return=minimal"}}),m);
const saveA=()=>cfgSave("announcement",{on:$("ao").checked,text:$("at").value.trim()},"Announcement saved");
const saveV=()=>cfgSave("min_app_version",+$("mv").value||0,"Version saved");
boot();
</script></body></html>
