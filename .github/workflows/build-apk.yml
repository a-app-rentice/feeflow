name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check site link was filled in
        working-directory: apk
        run: |
          if grep -q YOUR_SITE capacitor.config.json; then echo "Edit apk/capacitor.config.json and put your real pages.dev link"; exit 1; fi
      - name: Install
        working-directory: apk
        run: npm install
      - name: Create Android project
        working-directory: apk
        run: npx cap add android
      - name: Apply FeeFlow icon and plain launch screen
        working-directory: apk
        run: |
          RES=android/app/src/main/res
          cp -r res-overrides/mipmap-* $RES/
          find $RES -name splash.png -exec cp res-overrides/splash.png {} \;
          ls $RES/mipmap-xxxhdpi
      - name: Use fixed signing key
        run: mkdir -p ~/.android && cp apk/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: apk/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FeeFlow-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
